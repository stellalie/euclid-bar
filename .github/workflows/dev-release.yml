name: Dev release

# Manual fallback: Xcode Cloud publishes dev builds on each push to main (XcodeCloud/README.md).
# Rebuilds the current main as a signed, notarized build on the rolling `dev` pre-release in
# stellalie/euclid-bar-releases. Apps with `[updates] channel = "dev"` get it.
# Pre-releases never count as "latest", so the stable feed doesn't see these.
on:
  workflow_dispatch:

permissions:
  contents: read

# One build at a time, so two runs can't race on the release's files.
concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  dev:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for the version, history for the build number

      - name: Import signing certificate and notary key
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/ci-signing.sh

      - name: Build, sign, notarize, publish
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          LICENCE_PUBLIC_KEY: ${{ vars.LICENCE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: scripts/dev-release.sh
