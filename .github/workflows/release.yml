name: Release

# Dry run only: Xcode Cloud publishes releases when a v* tag is pushed (docs/RELEASING.md).
# Builds and signs with whatever secrets exist, uploads the files as a run artifact,
# publishes nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (dry run)"
        default: "0.0.0-dryrun"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a test reads old helper scripts from git history

      - name: Import signing certificate and notary key
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/ci-signing.sh

      - name: Build, sign, notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          LICENCE_PUBLIC_KEY: ${{ vars.LICENCE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release.sh "${VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release
