name: Release

# Push a tag like v1.2.0 → signed, notarized DMG + Sparkle update on a GitHub release
# in the public stellalie/euclid-bar-releases repo (this source repo is private).
# One-time setup (secrets, keys): docs/RELEASING.md.
# Manual run = dry run: builds and signs with whatever secrets exist, uploads the files
# as a run artifact, publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (dry run)"
        default: "0.0.0-dryrun"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a test reads old helper scripts from git history

      - name: Import signing certificate and notary key
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/ci-signing.sh

      - name: Build, sign, notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          LICENCE_PUBLIC_KEY: ${{ vars.LICENCE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release.sh "${VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }} # fine-grained PAT: Contents read/write on euclid-bar-releases
        run: |
          # Never publish an un-notarized build. Apple's ticket lookup drops connections now and then, so retry.
          for wait in 10 20 40 0; do
            xcrun stapler validate build/release/*.dmg && break
            [[ $wait == 0 ]] && exit 1
            sleep "$wait"
          done
          [[ -f build/release/appcast.xml ]] || { echo "No appcast.xml: set SPARKLE_PRIVATE_KEY before publishing" >&2; exit 1; }
          gh release create "$VERSION" --repo stellalie/euclid-bar-releases --title "Euclid ${VERSION#v}" --notes "Euclid ${VERSION#v} for macOS 14+ (Apple Silicon + Intel)." \
            build/release/*.dmg build/release/*.zip build/release/appcast.xml
