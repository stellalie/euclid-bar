name: UI screens

# Checks the search speed budget first (`--speed-budget`: every keystroke over 10k+ items
# under 8 ms, release build), then renders the panel offscreen (`euclid-bar --render-screens`) for UI review:
# one PNG per state, flow.gif, a short clip per feature (clips/), and the website's
# demo video (`--render-demo`, demo/). Published as a run artifact and, for PRs from
# this repo, to the `screens/pr-<number>` branch so the images can be linked.
on:
  pull_request:
    paths: ["Sources/EuclidBar/**", "Sources/EuclidCore/FuzzyMatcher.swift", "Sources/EuclidCore/Ranking/**", ".github/workflows/screens.yml"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        # The 2026-11-04 macos-15 image's SwiftPM sometimes trips over its own half-downloaded
        # Sparkle zip ("... already exists in file system"). Resolve without the shared cache,
        # and on failure clear the partial download and try again.
        run: |
          for attempt in 1 2 3; do
            swift package resolve --disable-dependency-cache && exit 0
            echo "resolve failed (attempt $attempt); clearing partial artifacts"
            rm -rf .build/artifacts ~/Library/Caches/org.swift.swiftpm/artifacts
            sleep 5
          done
          exit 1
      - name: Render
        run: |
          swift build -c release
          "$(swift build -c release --show-bin-path)/euclid-bar" --speed-budget
          "$(swift build -c release --show-bin-path)/euclid-bar" --render-screens screens
          "$(swift build -c release --show-bin-path)/euclid-bar" --render-demo screens/demo
          du -sh screens/clips screens/demo
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: screens
      - name: Publish to screens branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: screens/pr-${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ github.token }}
        run: |
          cd screens
          git init -q -b "$BRANCH"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "UI screens for $SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
