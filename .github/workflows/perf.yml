name: Perf

# Real numbers for the website: search speed, panel open time, idle memory and CPU.
# Run it from the Actions tab; results land in the job summary.
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/perf.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search benchmarks (release build)
        run: swift test -c release --filter performance 2>&1 | tee "$RUNNER_TEMP/bench.txt" | grep -E "worst|passed|failed"
      - name: Launch the app and measure
        run: |
          scripts/bundle.sh release
          # Measure a normal launch, not the first one: no once-per-Mac diagnostics alert left open,
          # and no login item added at launch (first launch only).
          ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/Euclid.app/Contents/Info.plist)
          defaults write "$ID" askedAboutReports -bool true
          defaults write "$ID" appliedOpenAtLogin -bool true
          export EUCLID_CONFIG_DIR="$RUNNER_TEMP/config" EUCLID_DATA_DIR="$RUNNER_TEMP/data"
          # Through Launch Services, so euclid:// reaches this copy.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f build/Euclid.app
          open --env EUCLID_CONFIG_DIR="$EUCLID_CONFIG_DIR" --env EUCLID_DATA_DIR="$EUCLID_DATA_DIR" build/Euclid.app
          sleep 2
          PID=$(pgrep -n -f Euclid.app/Contents/MacOS/euclid-bar)
          sleep 15 # let indexing settle
          for i in 1 2 3 4 5 6; do
            open "euclid://toggle"; sleep 1; open "euclid://toggle"; sleep 1
          done
          sleep 20
          ps -o rss=,%cpu= -p "$PID" > "$RUNNER_TEMP/idle.txt"
          log show --last 3m --predicate 'subsystem == "dev.euclid"' --style compact > "$RUNNER_TEMP/log.txt" || true
          kill "$PID"
      - name: Summary
        run: |
          {
            echo "## Euclid perf ($(sw_vers -productVersion), $(sysctl -n machdep.cpu.brand_string))"
            echo '```'
            grep -h "worst" "$RUNNER_TEMP/bench.txt" || echo "no benchmark output"
            echo
            grep -hoE "show: [0-9.e-]+ seconds" "$RUNNER_TEMP/log.txt" || echo "no show timings logged"
            grep -hoE "search -> [0-9]+ rows in [0-9.e-]+ seconds" "$RUNNER_TEMP/log.txt" | tail -5 || true
            echo
            read RSS CPU < "$RUNNER_TEMP/idle.txt"
            echo "idle: $((RSS / 1024)) MB resident, ${CPU}% CPU"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
