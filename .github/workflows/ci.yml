name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a test reads old helper scripts from git history
      - name: Build
        run: swift build
      - name: Test
        run: swift test
