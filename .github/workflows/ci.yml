name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a test reads old helper scripts from git history
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: |
          scripts/bundle.sh debug
          codesign --verify --strict --deep build/euclid-bar.app
          # Proves dyld finds Sparkle.framework inside the bundle (exits after rendering).
          build/euclid-bar.app/Contents/MacOS/euclid-bar --render-icon "$RUNNER_TEMP/icon.icns"
