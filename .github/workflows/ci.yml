name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a test reads old helper scripts from git history
      - name: Resolve packages
        # The 2026-11-04 macos-15 image's SwiftPM sometimes trips over its own half-downloaded
        # Sparkle zip ("... already exists in file system"). Resolve without the shared cache,
        # and on failure clear the partial download and try again.
        run: |
          for attempt in 1 2 3; do
            swift package resolve --disable-dependency-cache && exit 0
            echo "resolve failed (attempt $attempt); clearing partial artifacts"
            rm -rf .build/artifacts ~/Library/Caches/org.swift.swiftpm/artifacts
            sleep 5
          done
          exit 1
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: |
          scripts/bundle.sh debug
          codesign --verify --strict --deep build/Euclid.app
          # Proves dyld finds Sparkle.framework inside the bundle (exits after rendering).
          build/Euclid.app/Contents/MacOS/euclid-bar --render-icon "$RUNNER_TEMP/icon.icns"
