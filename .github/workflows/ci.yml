name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a test reads old helper scripts from git history
      - name: Resolve packages
        # The 2026-11-04 macos-15 image's SwiftPM fails putting Sparkle's binary into its shared cache
        # ("... already exists in file system"), even with the cache emptied. Resolve without it.
        run: swift package resolve --disable-dependency-cache
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: |
          scripts/bundle.sh debug
          codesign --verify --strict --deep build/Euclid.app
          # Proves dyld finds Sparkle.framework inside the bundle (exits after rendering).
          build/Euclid.app/Contents/MacOS/euclid-bar --render-icon "$RUNNER_TEMP/icon.icns"
